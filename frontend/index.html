    <!-- Pre-load Theme Script to Prevent Flash of Wrong Theme (FOUC) -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('theme-mode') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(isDark ? 'dark' : 'light');

          var presets = {
            blue: '#3b82f6',
            purple: '#a855f7',
            green: '#10b981',
            orange: '#f97316',
            pink: '#ec4899',
            cyan: '#06b6d4'
          };
          var accent = localStorage.getItem('theme-accent') || 'purple';
          var custom = localStorage.getItem('theme-custom-accent') || '#8b5cf6';
          var color = accent === 'custom' ? custom : (presets[accent] || presets.purple);

          // Helper to convert hex to RGB
          var cleanHex = color.replace('#', '');
          if (cleanHex.length === 3) {
            cleanHex = cleanHex.split('').map(function(c) { return c + c; }).join('');
          }
          var r = parseInt(cleanHex.substring(0, 2), 16) || 168;
          var g = parseInt(cleanHex.substring(2, 4), 16) || 85;
          var b = parseInt(cleanHex.substring(4, 6), 16) || 247;

          root.style.setProperty('--accent-color', color);
          root.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
          root.style.setProperty('--accent-light', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.12)');
          root.style.setProperty('--accent-border', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.3)');
          root.style.setProperty('--accent-glow', 'rgba(' + r + ', ' + g + ', ' + b + ', 0.25)');
          root.style.setProperty('--accent-gradient', 'linear-gradient(135deg, ' + color + ', #6366f1)');
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
