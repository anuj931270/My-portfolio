<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#030712"/>
      <stop offset="50%" stopColor="#0b0f19"/>
      <stop offset="100%" stopColor="#030712"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8"/>
      <stop offset="50%" stopColor="#a855f7"/>
      <stop offset="100%" stopColor="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stopColor="#6366f1" stopOpacity="0.3"/>
      <stop offset="100%" stopColor="#030712" stopOpacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="280" r="400" fill="url(#glow)"/>

  <!-- Logo Mark -->
  <rect x="560" y="100" width="80" height="80" rx="20" fill="url(#accent)" />
  <text x="600" y="152" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle">AP</text>

  <!-- Name -->
  <text x="600" y="240" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Anuj Pathak</text>

  <!-- Headline -->
  <text x="600" y="300" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="url(#accent)" text-anchor="middle">Data Scientist &bull; AI/ML Engineer &bull; Freelancer</text>

  <!-- Subtitle -->
  <text x="600" y="360" font-family="system-ui, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">Agentic AI (LangGraph, MCP) &bull; Enterprise RAG &bull; Deep Learning &bull; FastAPI &bull; Docker</text>

  <!-- Availability Badge -->
  <rect x="440" y="420" width="320" height="46" rx="23" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="468" cy="443" r="6" fill="#34d399"/>
  <text x="605" y="450" font-family="system-ui, monospace" font-size="15" font-weight="600" fill="#34d399" text-anchor="middle">Available for Freelance Work</text>

  <!-- Footer URL -->
  <text x="600" y="560" font-family="system-ui, monospace" font-size="16" fill="#64748b" text-anchor="middle">anujpathak.dev &bull; github.com/anuj931270 &bull; Gurugram, India</text>
</svg>

